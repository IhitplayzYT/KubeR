syntax = "proto3";

package cluster;

service ClusterApi {
    rpc CreatePod(CreatePodRequest) returns (CreatePodResponse);
    rpc GetPod(GetPodRequest) returns (Pod);
    rpc DeletePod(DeletePodRequest) returns (DeletePodResponse);
    rpc ListPods(ListPodsRequest) returns (ListPodsResponse);
    rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    rpc GetNode(GetNodeRequest) returns (Node);
    rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
    rpc ReportPodStatus(PodStatus) returns (Ack);
}

message CreatePodRequest {
    string name = 1;
    string namespace = 2;
    repeated ContainerSpec containers = 3;
}

message CreatePodResponse {
    string pod_id = 1;
}

message GetPodRequest {
    string pod_id = 1;
}

message DeletePodRequest {
    string pod_id = 1;
}

message DeletePodResponse {
    bool success = 1;
}

message ListPodsRequest {
    string namespace = 1;
}

message ListPodsResponse {
    repeated Pod pods = 1;
}

message RegisterNodeRequest {
    string address = 1;
    uint64 cpu_millis = 2;
    uint64 memory_bytes = 3;
    map<string, string> labels = 4;
}

message RegisterNodeResponse {
    string node_id = 1;
}

message HeartbeatRequest {
    string node_id = 1;
    uint64 cpu_millis = 2;
    uint64 memory_bytes = 3;
}

message HeartbeatResponse {
    bool accepted = 1;
}

message GetNodeRequest {
    string node_id = 1;
}

message ListNodesRequest {}

message ListNodesResponse {
    repeated Node nodes = 1;
}

message Ack {
    bool success = 1;
}

message Pod {
    string id = 1;
    string name = 2;
    string namespace = 3;
    PodSpec spec = 4;
    PodStatus status = 5;
    string phase = 6;
    string node_id = 7;
}

message PodSpec {
    repeated ContainerSpec containers = 1;
}

message ContainerSpec {
    string name = 1;
    string image = 2;
    repeated string command = 3;
    repeated string args = 4;
    uint64 cpu_millis = 5;
    uint64 memory_bytes = 6;
}

message PodStatus {
    string pod_id = 1;
    string phase = 2;
    string message = 3;
    repeated ContainerStatus container_statuses = 4;
}

message ContainerStatus {
    string name = 1;
    bool ready = 2;
    int32 exit_code = 3;
    string message = 4;
}

message Node {
    string id = 1;
    string address = 2;
    Resources capacity = 3;
    Resources allocatable = 4;
    string status = 5;
    map<string, string> labels = 6;
    int64 last_heartbeat = 7;
}

message Resources {
    uint64 cpu_millis = 1;
    uint64 memory_bytes = 2;
}
